name: Repair 2022 House governor from 2022 CSV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/repair_2022_house_governor_from_2022_csv.py
      - .github/workflows/repair-2022-house-governor-from-2022-csv.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted 2022-line repair
        run: python scripts/repair_2022_house_governor_from_2022_csv.py
      - name: Remove temporary repair files
        run: git rm --ignore-unmatch scripts/repair_2022_house_governor_from_2022_csv.py .github/workflows/repair-2022-house-governor-from-2022-csv.yml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/district_contests/state_house_governor_2008.json
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "Repair 2022 House governor districts from 2022 CSV [skip ci]"
          git push
