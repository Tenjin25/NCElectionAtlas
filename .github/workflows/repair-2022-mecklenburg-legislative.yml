name: Repair 2022 Mecklenburg legislative governor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/repair_2022_mecklenburg_legislative.py
      - .github/workflows/repair-2022-mecklenburg-legislative.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted repair
        run: python scripts/repair_2022_mecklenburg_legislative.py
      - name: Remove temporary repair files
        run: git rm --ignore-unmatch scripts/repair_2022_mecklenburg_legislative.py .github/workflows/repair-2022-mecklenburg-legislative.yml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/district_contests/state_senate_governor_2008.json data/district_contests/state_house_governor_2008.json
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "Repair 2022 Mecklenburg legislative governor districts [skip ci]"
          git push
