name: Apply 2022 and 2024 legislative calibration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/calibration_uploads/**
      - .github/workflows/apply-2022-2024-legislative-calibration.yml

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 2024 legislative CSVs from prior upload helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nc-calibration
          python - <<'PY'
          import pathlib
          import subprocess

          helper = subprocess.check_output([
              "git", "show", "209bdadd7d5f3ffa5fa6203eafb98fdac60c14d5:scripts/apply_targeted_dra_calibration_uploads.py"
          ], text=True)
          ns = {}
          exec(compile(helper, "apply_targeted_dra_calibration_uploads.py", "exec"), ns)
          out = pathlib.Path("/tmp/nc-calibration")
          for name in [
              "NC-2024-State-House-district-statistics 2004 pres.csv",
              "NC-2024-State-House-district-statistics 2008 gov.csv",
              "NC-2024-State-Senate-district-statistics 2004 pres.csv",
              "NC-2024-State-Senate-district-statistics 2008 gov.csv",
          ]:
              (out / name).write_text(ns["CSV_DATA"][name], encoding="utf-8")
          PY

      - name: Apply targeted calibration
        shell: bash
        run: |
          set -euo pipefail
          test -f 'data/calibration_uploads/NC-2022-State-House-district-statistics 2004 pres.csv'
          test -f 'data/calibration_uploads/NC-2022-State-House-district-statistics 2008 gov.csv'
          python scripts/calibrate_district_slices_from_stats_csv.py \
            --map 'data/district_contests/state_house_president_2004.json=data/calibration_uploads/NC-2022-State-House-district-statistics 2004 pres.csv' \
            --map 'data/district_contests/state_house_governor_2008.json=data/calibration_uploads/NC-2022-State-House-district-statistics 2008 gov.csv' \
            --map 'data/district_contests_2024_lines/state_house_president_2004.json=/tmp/nc-calibration/NC-2024-State-House-district-statistics 2004 pres.csv' \
            --map 'data/district_contests_2024_lines/state_house_governor_2008.json=/tmp/nc-calibration/NC-2024-State-House-district-statistics 2008 gov.csv' \
            --map 'data/district_contests_2024_lines/state_senate_president_2004.json=/tmp/nc-calibration/NC-2024-State-Senate-district-statistics 2004 pres.csv' \
            --map 'data/district_contests_2024_lines/state_senate_governor_2008.json=/tmp/nc-calibration/NC-2024-State-Senate-district-statistics 2008 gov.csv'

      - name: Remove temporary calibration inputs
        run: git rm --ignore-unmatch -r data/calibration_uploads .github/workflows/apply-2022-2024-legislative-calibration.yml

      - name: Commit calibrated JSONs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/district_contests/state_house_president_2004.json \
            data/district_contests/state_house_governor_2008.json \
            data/district_contests_2024_lines/state_house_president_2004.json \
            data/district_contests_2024_lines/state_house_governor_2008.json \
            data/district_contests_2024_lines/state_senate_president_2004.json \
            data/district_contests_2024_lines/state_senate_governor_2008.json
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "Calibrate 2022 and 2024 legislative district JSONs [skip ci]"
          git push
