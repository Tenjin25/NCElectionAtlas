name: Repair targeted district calibration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/repair_targeted_district_calibration.py
      - .github/workflows/repair-targeted-district-calibration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted line-family repair
        run: python scripts/repair_targeted_district_calibration.py

      - name: Remove temporary repair files
        run: |
          git rm --ignore-unmatch scripts/apply_targeted_dra_calibration_uploads.py scripts/repair_targeted_district_calibration.py .github/workflows/repair-targeted-district-calibration.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/district_contests data/district_contests_2024_lines data/district_contests_2026_lines || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Repair targeted district calibration by line family [skip ci]"
          git push
